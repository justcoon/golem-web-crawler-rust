# Schema for IDEA:
# $schema: https://schema.golem.cloud/app/golem/1.5.0/golem.schema.json
# Schema for vscode-yaml:
# yaml-language-server: $schema=https://schema.golem.cloud/app/golem/1.5.0/golem.schema.json

# Field reference: https://learn.golem.cloud/app-manifest#field-reference
# Creating HTTP APIs: https://learn.golem.cloud/invoke/making-custom-apis

manifestVersion: 1.5.0

app: golem-web-crawler-rust

environments:
  local:
    server: local
    componentPresets: debug
  cloud:
    server: cloud
    componentPresets: release
components:
  golem-rust:web-crawler:
    dir: ""
    templates: rust
    config:
      db:
        host: "{{ POSTGRES_HOST }}"
        db: "{{ POSTGRES_DB }}"
        port: "{{ POSTGRES_PORT }}"
secretDefaults:
  local:
    db:
      user: "{{ POSTGRES_USER }}"
      password: "{{ POSTGRES_PASSWORD }}"
    urlProcessing:
      boostWords: ["/docs/", "/blog/", "/wiki/", "/article/"]
      maxUrlLength: 200
      allowCrossDomain: false
httpApi:
  deployments:
    local:
    - domain: localhost:9006
      agents:
        OrchestratorAgent: {}
        DomainCrawlerAgent: {}
        SearchAgent: {}

