[package]
name = "golem_rust_web_crawler"
version = "0.0.1"
edition = "2024"

[profile.release]
opt-level = "s"
lto = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
log = { version = "0.4.29", features = ["kv"] }
golem-rust = { version = "2.1.0", features = ["export_golem_agentic", "url"] }
golem-wasi-http = { version = "0.2.0", features = ["json"] }
#golem-ai-embed = { version = "0.5.2" }
#golem-ai-embed-openai = { version = "0.5.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wstd = { version = "=0.6.5", features = ["default", "json"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
anyhow = "1.0"
regex = "1"
url = { version = "2", features = ["serde"] }